<!DOCTYPE html>
<html lang="ms-MY">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Matematik Ceria: Operasi Bahagi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* --- UI STYLE (MASTER REFERENCE - TEMA HIJAU) --- */
    body { 
        font-family: 'Fredoka', sans-serif; 
        background-color: #f0fdf4; 
        background-image: radial-gradient(#86efac 2px, transparent 2px); 
        background-size: 30px 30px; 
    }
    
    .game-card { 
        background: white; 
        border: 4px solid #475569; 
        box-shadow: 8px 8px 0px #00000020; 
        border-radius: 1.5rem; 
        min-height: 600px; 
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }
    
    /* Buttons */
    .btn-3d { 
        transition: all 0.1s; 
        border-bottom-width: 6px; 
        border-color: rgba(0,0,0,0.2); 
        transform: translateY(0); 
        cursor: pointer; 
        display: inline-block; 
    }
    .btn-3d:active:not(:disabled) { transform: translateY(4px); border-bottom-width: 2px; box-shadow: none; }
    .btn-3d:disabled { opacity: 0.6; cursor: not-allowed; border-bottom-width: 6px; filter: grayscale(100%); }

    /* Animation */
    .shake { animation: shake 0.4s ease-in-out; border-color: #ef4444 !important; background-color: #fee2e2 !important; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px) rotate(-5deg); } 75% { transform: translateX(8px) rotate(5deg); } }

    /* --- STYLE KHUSUS BAHAGI --- */

    /* Drag & Drop Elements */
    .draggable { cursor: grab; user-select: none; transition: transform 0.2s; }
    .draggable:active { cursor: grabbing; transform: scale(1.1); }
    
    .drop-zone { 
        border: 3px dashed #94a3b8; background-color: #f8fafc; 
        transition: all .3s ease; border-radius: 0.75rem; 
        min-width: 80px; min-height: 80px; 
        display: inline-flex; align-items: center; justify-content: center;
        font-weight: bold; color: #334155;
    }
    .drop-zone.drag-over { border-color: #3b82f6; background-color: #dbeafe; transform: scale(1.05); }
    .drop-zone.filled { border: 3px solid #22c55e; background-color: #dcfce7; color: #15803d; border-style: solid; }

    /* Aktiviti 2: Piring Biskut */
    .plate {
        width: 140px; height: 140px;
        background-color: #f0f9ff; border: 4px dashed #3b82f6;
        border-radius: 50%; /* Bulat */
        display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
        padding: 10px; transition: all 0.3s ease;
    }
    .plate.drag-over { background-color: #dbeafe; transform: scale(1.05); }
    .plate.filled { border-color: #22c55e; background-color: #dcfce7; border-style: solid; }
    .cookie-item { font-size: 2rem; animation: popIn 0.3s ease; }

    /* Aktiviti 3: Harta Karun */
    .gem-item {
        font-size: 3rem; cursor: pointer; transition: transform 0.2s;
        filter: grayscale(20%); opacity: 0.8;
    }
    .gem-item:hover { transform: scale(1.1); }
    .gem-item.selected { filter: grayscale(0%); opacity: 1; transform: scale(1.2); text-shadow: 0 0 10px #a855f7; }
    .gem-item.grouped { opacity: 0; transform: scale(0); transition: all 0.5s; }

    /* Aktiviti 5: Sandbox Inputs */
    .sandbox-input {
        font-size: 1.5rem; font-weight: bold; text-align: center;
        width: 100px; padding: 0.5rem; 
        border: 4px solid #fca5a5; border-radius: 1rem;
        background: #fff1f2; color: #991b1b;
    }
    .group-box {
        background: white; border: 3px solid #e5e7eb;
        padding: 10px; border-radius: 1rem; min-width: 80px;
        display: flex; flex-direction: column; align-items: center;
    }

    @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

  </style>
</head>
<body class="min-h-screen text-slate-800 pb-10">

  <div class="fixed top-4 left-0 right-0 z-50 px-4 pointer-events-none">
    <div class="max-w-4xl mx-auto bg-green-400 border-4 border-green-600 rounded-full px-6 py-3 shadow-xl flex items-center justify-between pointer-events-auto transform hover:scale-[1.01] transition-transform">
      <div class="flex items-center gap-3">
        <span class="text-3xl animate-bounce">➗</span>
        <span id="info-text" class="text-xl font-bold text-green-900 leading-none mt-1">Operasi Bahagi</span>
      </div>
      <button id="speak-btn" onclick="speakInfo()" class="bg-white hover:bg-green-50 text-green-600 border-2 border-green-200 rounded-full p-2 transition-colors shadow-sm">🔊</button>
    </div>
  </div>
  <div class="h-24"></div>

  <div class="max-w-6xl mx-auto p-4">
    
    <div class="game-card p-8 mb-8">
        <div id="activity-content" class="w-full relative z-10 flex flex-col items-center justify-center h-full">
            <div class="py-10 text-center">
                <div class="text-8xl mb-6 animate-pulse">🍪</div>
                <h2 class="text-5xl font-bold text-emerald-600 mb-4">Konsep Bahagi</h2>
                <p class="text-2xl text-slate-500 mb-8 font-semibold">Agih sama rata dan kumpul berkumpulan.</p>
                <div class="text-4xl animate-bounce">👇</div>
            </div>
        </div>
    </div>

    <div class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-lg p-6 border-2 border-white">
      <h3 class="text-2xl font-bold text-slate-700 mb-4 text-center">🎮 Pilih Aktiviti</h3>
      
      <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-8">
        <button onclick="loadActivity(1)" class="btn-3d bg-blue-500 text-white font-bold py-4 px-2 rounded-xl text-lg">👀 Kenali Simbol</button>
        <button onclick="loadActivity(2)" class="btn-3d bg-green-500 text-white font-bold py-4 px-2 rounded-xl text-lg">🍪 Agih Biskut</button>
        <button onclick="loadActivity(3)" class="btn-3d bg-purple-500 text-white font-bold py-4 px-2 rounded-xl text-lg">💎 Harta Karun</button>
        <button onclick="loadActivity(4)" class="btn-3d bg-orange-500 text-white font-bold py-4 px-2 rounded-xl text-lg">📝 Bina Ayat</button>
        <button onclick="loadActivity(5)" class="btn-3d bg-red-500 text-white font-bold py-4 px-2 rounded-xl text-lg">⚙️ Mesin Bahagi</button>
      </div>

      <div class="flex justify-center gap-4 border-t-2 border-slate-100 pt-6">
        <button onclick="clearActivity()" class="btn-3d bg-slate-400 text-white font-bold py-2 px-6 rounded-full text-lg">🏠 Menu</button>
        <button onclick="nextActivity()" class="btn-3d bg-indigo-500 text-white font-bold py-2 px-8 rounded-full text-xl">Seterusnya ➡️</button>
      </div>
    </div>
  </div>

  <script>
    /* --- STANDARD HELPERS --- */
    let currentActivity = 0;
    let ttsEnabled = false;
    let currentInfo = "Pilih aktiviti untuk mula belajar bahagi!";
    let draggedElement = null;
    
    // State Aktiviti
    let gemsSelected = [];

    function triggerWin() { confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } }); }

    function speak(text) { 
        if (!ttsEnabled || !('speechSynthesis' in window)) return; 
        window.speechSynthesis.cancel(); 
        const u = new SpeechSynthesisUtterance(text); u.lang = 'ms-MY'; u.rate = 0.95; u.pitch = 1.05; 
        const ms = window.speechSynthesis.getVoices().find(v => v.lang === 'ms-MY' || v.lang?.startsWith('ms')); 
        if (ms) u.voice = ms; 
        window.speechSynthesis.speak(u); 
    }
    
    function setInfo(text) { 
        currentInfo = text; const infoEl = document.getElementById('info-text'); 
        infoEl.style.opacity = 0; setTimeout(() => { infoEl.textContent = text; infoEl.style.opacity = 1; }, 200); 
    }
    
    function speakInfo() { 
        if (!ttsEnabled) { ttsEnabled = true; document.getElementById('speak-btn').classList.add('bg-green-100', 'text-green-600'); } 
        speak(currentInfo); 
    }

    /* --- DRAG & DROP HELPERS --- */
    window.dragStart = function(e) { draggedElement = e.target; e.target.classList.add('opacity-50'); }
    window.dragEnd = function(e) { if(e.target) e.target.classList.remove('opacity-50'); document.querySelectorAll('.drop-zone, .plate').forEach(z=>z.classList.remove('drag-over')); }
    window.allowDrop = function(e) { e.preventDefault(); if (e.currentTarget.classList.contains('drop-zone') || e.currentTarget.classList.contains('plate')) e.currentTarget.classList.add('drag-over'); }
    window.dragLeave = function(e) { if (e.currentTarget.classList.contains('drop-zone') || e.currentTarget.classList.contains('plate')) e.currentTarget.classList.remove('drag-over'); }

    /* --- ROUTER --- */
    function loadActivity(n) {
      currentActivity = n;
      const content = document.getElementById('activity-content');
      content.style.opacity = 0;
      setTimeout(() => {
          if (n === 1) loadSymbolIntro(content);
          if (n === 2) loadSharingActivity(content);
          if (n === 3) loadGroupingActivity(content);
          if (n === 4) loadSentenceBuilder(content);
          if (n === 5) loadDivisionSandbox(content);
          content.style.opacity = 1;
      }, 200);
    }

    function clearActivity() {
        currentActivity = 0;
        document.getElementById('activity-content').innerHTML = `<div class="py-10 text-center"><div class="text-8xl mb-6 animate-pulse">🍪</div><h2 class="text-5xl font-bold text-emerald-600 mb-4">Konsep Bahagi</h2><p class="text-2xl text-slate-500 mb-8 font-semibold">Pilih butang di bawah.</p></div>`;
        setInfo("Pilih aktiviti untuk mula belajar!");
    }
    function nextActivity() { let next = currentActivity + 1; if (next > 5) next = 1; loadActivity(next); }


    /* =========================================
       LOGIK AKTIVITI
       ========================================= */

    /* 1. Kenali Simbol */
    function loadSymbolIntro(content) {
      setInfo("Klik simbol untuk dengar maksudnya.");
      content.innerHTML = `
        <div class="w-full max-w-4xl text-center">
            <h3 class="text-3xl font-bold text-blue-600 mb-8">Kenali Simbol</h3>
            
            <div class="grid grid-cols-2 gap-8 mb-8">
                <button class="btn-3d bg-blue-100 hover:bg-blue-200 border-blue-300 text-blue-800 rounded-2xl p-10"
                    onclick="clickSymbol('÷', 'Simbol Bahagi', 'Maksudnya: Kongsi sama rata atau kumpul.')">
                    <div class="text-8xl font-black">÷</div>
                    <div class="text-xl mt-4">Bahagi</div>
                </button>
                
                <button class="btn-3d bg-blue-100 hover:bg-blue-200 border-blue-300 text-blue-800 rounded-2xl p-10"
                    onclick="clickSymbol('=', 'Simbol Sama Dengan', 'Maksudnya: Jawapan atau hasil.')">
                    <div class="text-8xl font-black">=</div>
                    <div class="text-xl mt-4">Sama Dengan</div>
                </button>
            </div>
            
            <div id="symbol-info" class="bg-blue-50 p-6 rounded-2xl border-2 border-blue-200 text-2xl text-blue-900 min-h-[100px] flex items-center justify-center">
                Sentuh simbol di atas.
            </div>
        </div>
      `;
    }
    function clickSymbol(sym, name, desc) {
        const msg = `${name}. ${desc}`;
        document.getElementById('symbol-info').innerHTML = `<strong>${sym}</strong> : ${desc}`;
        speak(msg);
    }

    /* 2. Agih Biskut */
    function loadSharingActivity(content) {
      setInfo("Agihkan biskut SAMA BANYAK kepada 2 kawan.");
      let cookies = '';
      for(let i=0; i<8; i++) cookies += `<div class="cookie-item cursor-grab" draggable="true" ondragstart="dragStart(event)" ondragend="dragEnd(event)" data-item="cookie">🍪</div>`;

      content.innerHTML = `
        <div class="w-full max-w-4xl text-center">
            <h3 class="text-3xl font-bold text-green-600 mb-6">Agih Biskut (Sama Banyak)</h3>
            
            <div class="bg-green-50 p-6 rounded-2xl border-2 border-green-200 mb-8">
                <h4 class="text-green-800 font-bold mb-4 uppercase">Balang Biskut</h4>
                <div id="cookie-jar" class="flex flex-wrap justify-center gap-2 min-h-[80px] bg-white rounded-xl p-4 border-2 border-green-100 shadow-inner">
                    ${cookies}
                </div>
            </div>

            <div class="flex justify-center gap-12 mb-8">
                <div class="flex flex-col items-center">
                    <div id="plate-1" class="plate bg-white" ondrop="dropOnPlate(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" data-count="0"></div>
                    <span class="mt-2 font-bold text-slate-500">Kawan A</span>
                </div>
                <div class="flex flex-col items-center">
                    <div id="plate-2" class="plate bg-white" ondrop="dropOnPlate(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" data-count="0"></div>
                    <span class="mt-2 font-bold text-slate-500">Kawan B</span>
                </div>
            </div>

            <div class="flex justify-center gap-4">
                <button onclick="checkSharing()" class="btn-3d bg-green-500 text-white font-bold py-3 px-8 rounded-xl text-lg">✅ Semak</button>
                <button onclick="loadActivity(2)" class="btn-3d bg-slate-400 text-white font-bold py-3 px-6 rounded-xl text-lg">🔄 Mula Semula</button>
            </div>
        </div>
      `;
    }

    function dropOnPlate(e) {
        e.preventDefault(); e.currentTarget.classList.remove('drag-over');
        if (!draggedElement || draggedElement.dataset.item !== 'cookie') return;
        
        e.currentTarget.appendChild(draggedElement);
        draggedElement.setAttribute('draggable', 'false'); // Lock after drop
        
        // Update count
        e.currentTarget.dataset.count = parseInt(e.currentTarget.dataset.count) + 1;
        speak("Satu biskut.");
    }

    function checkSharing() {
        const p1 = parseInt(document.getElementById('plate-1').dataset.count);
        const p2 = parseInt(document.getElementById('plate-2').dataset.count);
        const jarLeft = document.getElementById('cookie-jar').children.length;

        if (jarLeft > 0) {
            speak("Habiskan biskut dalam balang dulu."); setInfo("Biskut masih ada dalam balang!");
        } else if (p1 === p2) {
            speak("Syabas! Sama banyak."); setInfo("Betul! 8 bahagi 2 dapat 4."); triggerWin();
            document.getElementById('plate-1').classList.add('filled');
            document.getElementById('plate-2').classList.add('filled');
        } else {
            speak("Belum sama rata. Cuba lagi."); setInfo("Tak sama rata. Kawan sedih nanti.");
            document.getElementById('plate-1').classList.add('shake');
            document.getElementById('plate-2').classList.add('shake');
            setTimeout(()=> { document.querySelectorAll('.plate').forEach(p=>p.classList.remove('shake'))}, 500);
        }
    }

    /* 3. Kumpul Harta Karun */
    function loadGroupingActivity(content) {
        setInfo("Klik permata untuk kumpul TIGA-TIGA.");
        gemsSelected = [];
        let gems = '';
        for(let i=0; i<12; i++) gems += `<div class="gem-item" onclick="clickGem(event)" data-grouped="false">💎</div>`;

        content.innerHTML = `
            <div class="w-full max-w-4xl text-center">
                <h3 class="text-3xl font-bold text-purple-600 mb-6">Kumpul Harta Karun</h3>
                
                <div class="flex justify-center mb-8">
                    <div class="bg-purple-100 border-4 border-purple-300 rounded-2xl p-6 flex items-center gap-4 shadow-lg">
                        <span class="text-5xl">📦</span>
                        <div class="text-left">
                            <div class="text-sm font-bold text-purple-400 uppercase">Bilangan Peti</div>
                            <div id="chest-counter" class="text-4xl font-black text-purple-800">0</div>
                        </div>
                    </div>
                </div>

                <div class="bg-indigo-50 p-8 rounded-3xl border-2 border-indigo-200">
                    <p class="mb-4 text-slate-500 font-bold">Klik 3 permata untuk masuk satu peti.</p>
                    <div id="gem-area" class="flex flex-wrap justify-center gap-4">
                        ${gems}
                    </div>
                </div>
                
                <button onclick="loadActivity(3)" class="btn-3d bg-slate-400 text-white font-bold py-2 px-6 rounded-xl mt-6">🔄 Reset</button>
            </div>
        `;
    }

    function clickGem(e) {
        const gem = e.currentTarget;
        if (gem.dataset.grouped === 'true') return;

        gem.classList.toggle('selected');
        
        // Update list
        gemsSelected = Array.from(document.querySelectorAll('.gem-item.selected'));
        
        if (gemsSelected.length === 3) {
            // Success Group
            speak("Dapat satu peti!");
            const counter = document.getElementById('chest-counter');
            counter.textContent = parseInt(counter.textContent) + 1;
            
            gemsSelected.forEach(g => {
                g.classList.remove('selected');
                g.dataset.grouped = 'true';
                g.classList.add('grouped'); // Animate out
            });
            gemsSelected = [];

            // Check Win
            if (document.querySelectorAll('.gem-item[data-grouped="false"]').length === 0) {
                setTimeout(() => {
                    triggerWin(); setInfo("Syabas! 12 bahagi 3 dapat 4."); speak("Semua permata dah disimpan.");
                }, 500);
            }
        }
    }

    /* 4. Bina Ayat Matematik */
    function loadSentenceBuilder(content) {
        setInfo("Lengkapkan ayat: 12 permata dikumpul tiga-tiga.");
        const cards = ['12', '3', '4', '÷', '='];
        
        content.innerHTML = `
            <div class="w-full max-w-4xl text-center">
                <h3 class="text-3xl font-bold text-orange-600 mb-6">Bina Ayat Matematik</h3>
                
                <div class="bg-orange-50 p-4 rounded-2xl border-2 border-orange-200 mb-8">
                    <p class="text-xl text-orange-900">"Ada <strong>12</strong> permata. Dikumpul <strong>tiga-tiga</strong> (3). Dapat <strong>4</strong> peti."</p>
                </div>

                <div class="flex justify-center gap-4 mb-8">
                    ${cards.sort(()=>Math.random()-0.5).map(c => `
                        <div class="btn-3d bg-white border-orange-300 text-orange-800 rounded-xl w-16 h-16 flex items-center justify-center text-3xl font-bold draggable" 
                             draggable="true" ondragstart="dragStart(event)" ondragend="dragEnd(event)" data-val="${c}">${c}</div>
                    `).join('')}
                </div>

                <div class="flex justify-center items-center gap-2 bg-white p-6 rounded-3xl border-2 border-slate-200 shadow-sm" id="math-row">
                    <div class="drop-zone w-20 h-24 rounded-xl bg-slate-100 text-3xl font-bold text-slate-700" ondrop="dropMath(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" data-ans="12"></div>
                    <div class="drop-zone w-20 h-24 rounded-xl bg-slate-100 text-3xl font-bold text-slate-700" ondrop="dropMath(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" data-ans="÷"></div>
                    <div class="drop-zone w-20 h-24 rounded-xl bg-slate-100 text-3xl font-bold text-slate-700" ondrop="dropMath(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" data-ans="3"></div>
                    <div class="drop-zone w-20 h-24 rounded-xl bg-slate-100 text-3xl font-bold text-slate-700" ondrop="dropMath(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" data-ans="="></div>
                    <div class="drop-zone w-20 h-24 rounded-xl bg-slate-100 text-3xl font-bold text-slate-700" ondrop="dropMath(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" data-ans="4"></div>
                </div>
            </div>
        `;
    }

    function dropMath(e) {
        e.preventDefault(); e.currentTarget.classList.remove('drag-over');
        if (!draggedElement) return;
        
        const val = draggedElement.dataset.val;
        const correct = e.currentTarget.dataset.ans;

        if (val === correct) {
            e.currentTarget.textContent = val;
            e.currentTarget.classList.add('filled');
            e.currentTarget.classList.remove('drop-zone');
            draggedElement.remove(); draggedElement = null;
            speak("Betul.");
            
            if (document.querySelectorAll('#math-row .drop-zone').length === 0) {
                triggerWin(); setInfo("Tahniah! Ayat matematik lengkap.");
            }
        } else {
            e.currentTarget.classList.add('shake'); setTimeout(()=>e.currentTarget.classList.remove('shake'), 500);
            speak("Salah tempat.");
        }
    }

    /* 5. Mesin Bahagi (Sandbox) */
    function loadDivisionSandbox(content) {
        setInfo("Masukkan nombor untuk melihat pengagihan.");
        content.innerHTML = `
            <div class="w-full max-w-4xl text-center">
                <h3 class="text-3xl font-bold text-red-600 mb-6">Mesin Bahagi Visual</h3>
                
                <div class="bg-red-50 p-6 rounded-3xl border-2 border-red-200 mb-8 flex justify-center items-center gap-4 flex-wrap">
                    <input type="number" id="inp-total" class="sandbox-input" placeholder="Jum" min="1" max="30">
                    <span class="text-4xl font-black text-red-400">÷</span>
                    <input type="number" id="inp-group" class="sandbox-input" placeholder="Kum" min="1" max="10">
                    <button onclick="runSandbox()" class="btn-3d bg-red-500 text-white font-bold py-2 px-6 rounded-xl text-xl">Lihat! 🔍</button>
                </div>

                <div id="sandbox-visual" class="flex flex-wrap justify-center gap-4 min-h-[200px]"></div>
                <div id="sandbox-msg" class="mt-4 text-xl font-bold text-slate-600"></div>
            </div>
        `;
    }

    function runSandbox() {
        const total = parseInt(document.getElementById('inp-total').value);
        const groups = parseInt(document.getElementById('inp-group').value);
        const visual = document.getElementById('sandbox-visual');
        const msg = document.getElementById('sandbox-msg');

        if (!total || !groups || total > 30 || groups > 10) {
            speak("Nombor terlalu besar atau kosong."); return;
        }

        visual.innerHTML = '';
        const perGroup = Math.floor(total / groups);
        const remainder = total % groups;

        // Draw Groups
        for(let i=0; i<groups; i++) {
            let html = `<div class="group-box shadow-sm"><span class="text-xs font-bold text-slate-400 mb-2">Kum ${i+1}</span><div class="flex flex-wrap justify-center gap-1">`;
            for(let j=0; j<perGroup; j++) html += `<span class="text-xl">🍎</span>`;
            html += `</div></div>`;
            visual.innerHTML += html;
        }

        // Draw Remainder
        if (remainder > 0) {
            let html = `<div class="group-box border-dashed border-red-300 bg-red-50"><span class="text-xs font-bold text-red-400 mb-2">Baki</span><div class="flex flex-wrap justify-center gap-1">`;
            for(let k=0; k<remainder; k++) html += `<span class="text-xl opacity-50">🍎</span>`;
            html += `</div></div>`;
            visual.innerHTML += html;
        }

        const txt = `${total} bahagi ${groups} sama dengan ${perGroup}, baki ${remainder}.`;
        msg.textContent = txt;
        speak(txt);
    }

  </script>
</body>
</html>
